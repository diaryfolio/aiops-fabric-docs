name: Documentation

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "Makefile"
      - "requirements-docs.txt"
      - "scripts/**"
      - "tests/**"
      - "zensical.toml"
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "Makefile"
      - "requirements-docs.txt"
      - "scripts/**"
      - "tests/**"
      - "zensical.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Release pushes publish snapshots alongside the current main documentation.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install documentation toolchain
        run: python -m pip install --requirement requirements-docs.txt
      - name: Test documentation publishing
        run: python -m unittest discover -s tests
      - name: Read GitHub Pages configuration
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6
      - name: Build documentation
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: bash scripts/build-docs.sh
      - name: Upload GitHub Pages artifact
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
